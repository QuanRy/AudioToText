<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AudioToText — Цифровые аватары</title>
    <link rel="icon" type="image/png" href="../../../../icons/img/smiles/micro_40.png">
    <link rel="stylesheet" href="../css/digital_avatars_menu.css">
</head>
<body>

<div class="app">

    <button class="back-btn" title="Вернуться в главное меню">
        <img src="../../../../icons/back_arrow.svg" alt="back">
    </button>

    <h1 class="title">Цифровые аватары</h1>

    <div class="history-container">
        <div class="history-header">
            <span>Имя аватара</span>
            <span>Голос</span>
            <span>Язык</span>
            <span>Симв.</span>
            <span>Описание</span>
            <span>Создан</span>
            <span>Изменён</span>
        </div>
        <div class="history-list" id="avatarList">
            <div class="history-loading">Загрузка...</div>
        </div>
    </div>

    <div class="buttons">
        <button id="createAvatarBtn">
            <img src="../../../../icons/img/smiles/add_avatar.png">
            Создать аватара
        </button>
    </div>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">

        <h2 class="modal-title">Информация об аватаре</h2>

        <div class="modal-info-grid">
            <div class="modal-info-item">
                <label>Имя аватара</label>
                <input type="text" id="modalName" readonly>
            </div>
            <div class="modal-info-item">
                <label>Голос</label>
                <input type="text" id="modalVoice" readonly>
            </div>
            <div class="modal-info-item">
                <label>Язык</label>
                <input type="text" id="modalLang" readonly>
            </div>
            <div class="modal-info-item">
                <label>Кол-во символов</label>
                <input type="text" id="modalCharCount" readonly>
            </div>
            <div class="modal-info-item">
                <label>Дата создания</label>
                <input type="text" id="modalCreatedAt" readonly>
            </div>
            <div class="modal-info-item">
                <label>Дата изменения</label>
                <input type="text" id="modalUpdatedAt" readonly>
            </div>
        </div>

        <label class="modal-text-label">Описание / системный промпт</label>
        <textarea class="modal-text-field" id="modalDesc"></textarea>

        <div class="modal-buttons">
            <button class="modal-btn btn-back" id="modalClose">Назад</button>
            <button class="modal-btn btn-save" id="modalSave" disabled>Сохранить изменения</button>
            <button class="modal-btn btn-delete" id="modalDelete">Удалить</button>
        </div>

    </div>
</div>

<!-- Диалог подтверждения удаления -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <p>Вы действительно хотите удалить этого аватара?</p>
        <div class="confirm-buttons">
            <button class="modal-btn btn-delete" id="confirmYes">Да</button>
            <button class="modal-btn btn-back" id="confirmNo">Нет</button>
        </div>
    </div>
</div>

<script src="../js/digital_avatars_script.js"></script>
<script src="../js/back_btn_script.js"></script>

</body>
</html>
